name: 报一个问题
description: 算错账、说错话、该显示的东西没显示
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        这个项目最在意的三类问题：**口径算错**（数字不对）、**文案说错话**（界面在撒谎）、
        **状态没交代清楚**（该出现的提示没出现）。这三类最欢迎。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 菜单 →「关于」里那串；或者 `grep CFBundleShortVersionString 浮窗待办.app/Contents/Info.plist`
      placeholder: "0.5.0"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS 版本
      placeholder: "14.6 / 15.1 / 26.0"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 你看到什么
      description: 越具体越好。哪个位置、哪个页签、屏幕上写的是什么字。
    validations:
      required: true

  - type: textarea
    id: expect
    attributes:
      label: 你以为会看到什么
      description: 如果你觉得数字不对，说清你是怎么数出来的——这一步比结论重要。
    validations:
      required: true

  - type: dropdown
    id: repro
    attributes:
      label: 能重复出现吗
      options:
        - 每次都能
        - 偶尔
        - 只出现过一次
    validations:
      required: true

  - type: checkboxes
    id: data
    attributes:
      label: 关于你的数据
      description: |
        数据只在你自己硬盘上（`~/Library/Application Support/DeskTodo/data.json`），
        我看不到。要贴的话请**先自己删掉任务正文**，只留结构。
      options:
        - label: 我知道贴数据前要删掉任务正文
          required: true
